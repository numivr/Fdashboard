<ion-menu contentId="main-content" menuId="main-menu">

  <ion-header>
    <ion-toolbar color="primary">
      <ion-title>🛡️ Security</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-content>
    @if (currentUser) {
      <div class="user-box">
        <ion-icon name="person-circle-outline" class="user-avatar"></ion-icon>
        <div class="user-details">
          <strong>{{ currentUser.username }}</strong>
          <ion-note>{{ currentUser.role }}</ion-note>
        </div>
      </div>
    }

    <ion-list lines="none" class="nav-list">
      @for (item of navItems; track item.path) {
        <ion-menu-toggle autoHide="false">
          <ion-item
            [routerLink]="item.path"
            routerLinkActive="active-item"
            button detail="false">
            <ion-icon [name]="item.icon" slot="start"></ion-icon>
            <ion-label>{{ item.label }}</ion-label>
            @if (item.path === '/app/alerts' && alertState.unreadCount() > 0) {
              <ion-badge slot="end" color="danger">{{ alertState.unreadCount() }}</ion-badge>
            }
          </ion-item>
        </ion-menu-toggle>
      }
    </ion-list>
  </ion-content>

  <ion-footer>
    <ion-toolbar>
      <ion-button fill="clear" expand="full" (click)="logout()" color="medium">
        <ion-icon name="log-out-outline" slot="start"></ion-icon>
        Cerrar sesión
      </ion-button>
    </ion-toolbar>
  </ion-footer>

</ion-menu>

<ion-router-outlet id="main-content"></ion-router-outlet>
