<ion-content class="login-bg">
  <div class="login-wrapper">
    <ion-card class="login-card">
      <ion-card-header>
        <div class="login-logo">🛡️</div>
        <ion-card-title>Security Dashboard</ion-card-title>
        <ion-card-subtitle>Accede con tus credenciales</ion-card-subtitle>
      </ion-card-header>

      <ion-card-content>
        <ion-item>
          <ion-label position="floating">Usuario</ion-label>
          <ion-input
            [(ngModel)]="username"
            type="text"
            autocomplete="username"
            (keyup.enter)="login()">
          </ion-input>
        </ion-item>

        <ion-item class="ion-margin-top">
          <ion-label position="floating">Contraseña</ion-label>
          <ion-input
            [(ngModel)]="password"
            type="password"
            autocomplete="current-password"
            (keyup.enter)="login()">
          </ion-input>
        </ion-item>

        @if (error()) {
          <ion-note color="danger" class="error-note">{{ error() }}</ion-note>
        }

        <ion-button
          expand="block"
          class="ion-margin-top"
          (click)="login()"
          [disabled]="loading()">
          @if (loading()) {
            <ion-spinner name="crescent" slot="start"></ion-spinner>
          }
          Entrar
        </ion-button>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
